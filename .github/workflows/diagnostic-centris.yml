name: Diagnostic Centris (temporaire)

# Lecture seule : récupère le zip du jour et imprime une analyse du flux.
# Ne construit rien, ne commit rien. À supprimer une fois le diagnostic fait.
on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Centris zip (DriveHQ)
        env:
          DRIVEHQ_USER: ${{ secrets.DRIVEHQ_USER }}
          DRIVEHQ_PASS: ${{ secrets.DRIVEHQ_PASS }}
          DRIVEHQ_WEBDAV_URL: ${{ secrets.DRIVEHQ_WEBDAV_URL }}
        run: node scripts/fetch-centris.mjs

      - name: Analyse du flux
        run: node scripts/diagnostic-centris.mjs
